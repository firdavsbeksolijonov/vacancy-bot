name: Vacancy Bot

on:
  schedule:
    - cron: '0 */2 * * *'  # Har 2 soatda
  workflow_dispatch: {}

concurrency:
  group: check-vacancies
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Repo ni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalar o'rnatish
        run: pip install requests feedparser rapidfuzz pandas openpyxl

      - name: DB ni cache dan olish
        uses: actions/cache@v4
        with:
          path: industry_filler/company_vacancies.db
          key: vacancy-db-${{ github.run_id }}
          restore-keys: |
            vacancy-db-

      - name: Botni ishga tushirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python industry_filler/company_vacancy_bot.py
